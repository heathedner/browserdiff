<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browser Detector</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        /* Default Layout */
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .info {
            padding: 10px;
            border: 1px solid #000;
            background-color: #fff;
        }

        /* Firefox-specific styles */
        @-moz-document url-prefix() {
            body { background-color: lightblue; }
            .container { flex-direction: row; justify-content: space-around; }
            .info { border: 2px dashed darkblue; }
        }

        /* Edge-specific styles */
        @supports (-ms-ime-align: auto) {
            body { background-color: lightgreen; }
            .container { flex-direction: column-reverse; }
            .info { border: 2px dotted darkgreen; }
        }

        /* Chrome-specific styles */
        @supports (-webkit-touch-callout: none) {
            body { background-color: lightyellow; }
            .container { display: grid; grid-template-columns: 1fr 1fr; }
            .info { border: 2px solid goldenrod; }
        }

        /* Safari-specific styles */
        @supports (overflow: -webkit-marquee) {
            body { background-color: pink; }
            .container { display: flex; flex-wrap: wrap; justify-content: center; }
            .info { border: 2px groove crimson; }
        }

        /* Table for extra details */
        table {
            width: 80%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        table, th, td {
            border: 1px solid black;
        }
        th, td {
            padding: 10px;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1 style="text-align: center;">Browser and Device Information</h1>
    <div class="container">
        <div class="info" id="browserInfo">Detecting...</div>
        <table>
            <tr><th>Feature</th><th>Value</th></tr>
            <tr><td>Browser</td><td id="browserName">Detecting...</td></tr>
            <tr><td>Screen Size</td><td id="screenSize">Detecting...</td></tr>
            <tr><td>Platform</td><td id="platform">Detecting...</td></tr>
        </table>
    </div>

    <script>
        function getBrowserInfo() {
            let userAgent = navigator.userAgent;
            let browserName = "Unknown Browser";
            
            if (userAgent.includes("Firefox")) {
                browserName = "Firefox";
            } else if (userAgent.includes("Edg")) {
                browserName = "Microsoft Edge";
            } else if (userAgent.includes("Chrome")) {
                browserName = "Google Chrome";
            } else if (userAgent.includes("Safari")) {
                browserName = "Safari";
            } else if (userAgent.includes("Opera") || userAgent.includes("OPR")) {
                browserName = "Opera";
            } else if (userAgent.includes("MSIE") || userAgent.includes("Trident")) {
                browserName = "Internet Explorer";
            }
            
            return browserName;
        }

        function getDeviceInfo() {
            return `Screen: ${screen.width}x${screen.height}, Platform: ${navigator.platform}`;
        }

        document.getElementById("browserInfo").innerText = `Browser: ${getBrowserInfo()}\n${getDeviceInfo()}`;
        document.getElementById("browserName").innerText = getBrowserInfo();
        document.getElementById("screenSize").innerText = `${screen.width}x${screen.height}`;
        document.getElementById("platform").innerText = navigator.platform;
    </script>
</body>
</html>
