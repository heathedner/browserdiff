<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browser Detector</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .info {
            padding: 10px;
            border: 1px solid #000;
            background-color: #fff;
        }

        table {
            width: 80%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        table, th, td {
            border: 1px solid black;
        }
        th, td {
            padding: 10px;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1 style="text-align: center;">Browser and Device Information</h1>
    <div class="container">
        <div class="info" id="browserInfo">Detecting...</div>
        <table>
            <tr><th>Feature</th><th>Value</th></tr>
            <tr><td>Browser</td><td id="browserName">Detecting...</td></tr>
            <tr><td>Screen Size</td><td id="screenSize">Detecting...</td></tr>
            <tr><td>Platform</td><td id="platform">Detecting...</td></tr>
        </table>
    </div>

    <script>
        function getBrowserInfo() {
            let userAgent = navigator.userAgent;
            let browserName = "Unknown Browser";
            
            if (userAgent.includes("Firefox")) {
                browserName = "Firefox";
                document.body.style.backgroundColor = "lightblue";
                document.body.style.fontFamily = "Courier New, monospace";
            } else if (userAgent.includes("Edg")) {
                browserName = "Microsoft Edge";
                document.body.style.backgroundColor = "lightgreen";
                document.body.style.fontSize = "18px";
            } else if (userAgent.includes("Chrome")) {
                browserName = "Google Chrome";
                document.body.style.backgroundColor = "lightyellow";
                document.body.style.display = "grid";
                document.body.style.gridTemplateColumns = "1fr 1fr";
            } else if (userAgent.includes("Safari")) {
                browserName = "Safari";
                document.body.style.backgroundColor = "pink";
                document.body.style.textAlign = "center";
            } else if (userAgent.includes("Opera") || userAgent.includes("OPR")) {
                browserName = "Opera";
                document.body.style.backgroundColor = "lavender";
                document.body.style.border = "5px dashed purple";
            } else if (userAgent.includes("MSIE") || userAgent.includes("Trident")) {
                browserName = "Internet Explorer";
                document.body.style.backgroundColor = "gray";
                document.body.style.color = "white";
            }
            
            return browserName;
        }

        function getDeviceInfo() {
            return `Screen: ${screen.width}x${screen.height}, Platform: ${navigator.platform}`;
        }

        document.getElementById("browserInfo").innerText = `Browser: ${getBrowserInfo()}\n${getDeviceInfo()}`;
        document.getElementById("browserName").innerText = getBrowserInfo();
        document.getElementById("screenSize").innerText = `${screen.width}x${screen.height}`;
        document.getElementById("platform").innerText = navigator.platform;
    </script>
</body>
</html>
